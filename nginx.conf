# /etc/nginx/sites-available/anouckmartin

server {
    listen 87.98.245.230:443 ssl; # managed by Certbot
    listen [2001:41d0:c:d27::aba]:443 ssl; # managed by Certbot

    server_name anouckmartin.lpz.ovh anouckmartin.com www.anouckmartin.com anouckmartin.fr www.anouckmartin.fr;
    root /home/alban/www/anouckmartin.psy/frontend;

    # Certificats SSL
    ssl_certificate /etc/letsencrypt/live/anouckmartin.lpz.ovh/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/anouckmartin.lpz.ovh/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Logs
    access_log /var/log/nginx/anouckmartin.psy.access.log main;
    error_log /var/log/nginx/anouckmartin.psy.error.log warn;

    # Sécurité
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # Exception pour la validation Certbot / Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    # API d'administration
    location /api/ {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Fichiers sensibles
    location = /admin.json { deny all; }
    location /backups/ { deny all; }

    # Fichiers statiques
    location / {
        try_files $uri $uri/ =404;

        location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location ~* \.html$ {
            expires 1h;
            add_header Cache-Control "public, no-cache";
        }
    }

    # Blocage des fichiers cachés (AVEC exception pour .well-known)
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* \.(log|sql|env|sh|conf|ini|swp|htaccess|htpasswd)$ {
        deny all;
    }

}

# Redirection HTTP vers HTTPS pour tous les domaines
server {
    if ($host = www.anouckmartin.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = anouckmartin.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = www.anouckmartin.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = anouckmartin.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = anouckmartin.lpz.ovh) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 87.98.245.230:80;
    listen [2001:41d0:c:d27::aba]:80;
    server_name anouckmartin.lpz.ovh anouckmartin.com www.anouckmartin.com anouckmartin.fr www.anouckmartin.fr;

    # Exception pour la validation Certbot sur le port 80
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
